pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_footprint       
    transform_tolerance: 0.05
    min_height: 0.05   
    max_height: 0.386     
    angle_min: -3.14159           
    angle_max: 3.14159         
    angle_increment: 0.00873 #(angle_max-angle_min)/720 
    scan_time: 0.333
    range_min: 0.9
    range_max: 20.0
    use_inf: true
    inf_epsilon: 1.0